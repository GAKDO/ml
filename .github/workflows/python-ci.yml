# 파이썬 검사: ruff(문법·스타일) + pytest. (블로그 render-worker-ci.yml을 옮김: 운영체제별 matrix)
name: python-ci

# 언제 도나: ① PR ② develop·main push. 워커·학습은 집 PC에서 돈다
on:
  pull_request:   # PR은 문서만 바뀌어도 돈다: 필수 검사가 '대기'로 멈춰 머지가 막히지 않게
  push:
    branches: [main, develop]
    paths-ignore: ["**/*.md"]

permissions:
  contents: read

concurrency:
  group: python-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    # 기록부(PgRegistry) 시험용. 운영과 같은 PostgreSQL 16, 스키마 ml은 init-db.sh처럼 앱 계정 소유
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: trace
          POSTGRES_PASSWORD: trace-ci
          POSTGRES_DB: trace
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U trace" --health-interval 5s --health-timeout 5s --health-retries 10
      # inspect-worker(ML2) 시험용: 꺼져 있던 동안 쌓인 메시지 처리·DLQ
      rabbitmq:
        image: rabbitmq:3.13-alpine
        ports: ["5672:5672"]
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping" --health-interval 5s --health-timeout 10s --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      # 계약 스키마(ML2 이벤트 검사)는 raw.githubusercontent 캐시(약 5분) 대신 contracts develop을 바로 받는다.
      # 계약 PR이 막 머지된 직후에도 옛 스키마로 검사하지 않게 한다
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: GAKDO/contracts
          ref: develop
          path: .contracts
          persist-credentials: false
      - name: 설치
        run: python -m pip install -q -e ".[dev]"
      - name: ruff
        run: python -m ruff check .
      - name: 테스트
        env:
          PYTHONUTF8: "1"
          TRACE_CONTRACTS_DIR: .contracts
          TRACE_ML_TEST_DB: "1"
          POSTGRES_HOST: localhost
          DB_USERNAME: trace
          DB_PASSWORD: trace-ci
          TRACE_ML_TEST_AMQP: "1"
          RABBITMQ_HOST: localhost
          RABBITMQ_USERNAME: guest
          RABBITMQ_PASSWORD: guest
        run: python -m pytest -q
