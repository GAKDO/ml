# inspect-worker 이미지를 만들어 GHCR(ghcr.io/gakdo/inspect-worker)에 올린다. 학교 서버 Compose가 이 이미지를 받는다.
name: inspect-worker 이미지

# [PR]           Dockerfile·소스가 바뀌면 빌드만 해 보고 올리지 않음
# [develop push] :커밋SHA·:develop
# [main push]    :커밋SHA·:latest
on:
  pull_request:
    paths: ["Dockerfile", ".dockerignore", "pyproject.toml", "src/**", ".github/workflows/image.yml"]
  push:
    branches: [main, develop]
    paths: ["Dockerfile", ".dockerignore", "pyproject.toml", "src/**", ".github/workflows/image.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    name: 이미지 빌드
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: 이미지 이름 정하기
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/inspect-worker" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # 먼저 올리지 않고 빌드해 이미지 안에서 불러오기를 확인한다(실패하면 GHCR에 태그가 올라가지 않음)
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: inspect-worker:check
          build-args: |
            APP_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: 이미지 안에서 불러오기 확인
        run: |
          docker run --rm --entrypoint python inspect-worker:check -c "import onnxruntime, cv2, pika, redis; from trace_ml.inspect.onnx_seg import onnx_infer; print('ok', onnxruntime.__version__)"
      # 확인을 통과하면 같은 캐시로 다시 만들어(빌드 생략) 올린다
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        if: github.event_name != 'pull_request'
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ github.ref == 'refs/heads/main' && format('{0}:latest', env.IMAGE) || '' }}
            ${{ github.ref == 'refs/heads/develop' && format('{0}:develop', env.IMAGE) || '' }}
          build-args: |
            APP_COMMIT=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
